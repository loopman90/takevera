name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: {label: What happened?, description: Describe the problem without private project data.}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. Open...\n2. Select...\n3. Observe..."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected result}
  - type: input
    id: environment
    attributes: {label: Takevera version and operating system}
    validations: {required: true}
